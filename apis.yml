name: Clearwave
kind: company
description: Clearwave is a patient revenue-cycle and self-service engagement platform
  for healthcare practices, covering online scheduling, self-service registration
  and intake, multi-factor insurance eligibility verification, and patient payments.
  Rather than publishing an open developer API, Clearwave connects to more than 50
  electronic health record (EHR) and practice management (PM) systems - including
  athenahealth, NextGen, eClinicalWorks, Modernizing Medicine, Veradigm, Nextech,
  Greenway, and Unlimited Systems - through formal, partner-gated API license and
  integration agreements. Data such as appointments, patient demographics,
  eligibility results, and payments flows bidirectionally between Clearwave and the
  practice's EHR/PM in real time. There is no public, self-service developer portal,
  OpenAPI definition, or documented public WebSocket API; the API surfaces below are
  logical capability areas modeled from Clearwave's product documentation, not
  publicly documented endpoints.
