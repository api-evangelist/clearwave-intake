actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and Clearwave publishes no public API at
    all - integration is partner-gated via licensed EHR/PM agreements. No AsyncAPI
    document was created because there is no documented public server-push transport
    (or any public transport) on Clearwave's own API to model. The apis.yml entry
    documents the provider honestly as partner-gated, with logical capability areas
    marked endpointsModeled: true rather than fabricated endpoints.
